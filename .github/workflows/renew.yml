name: DNSHE Domain Auto Renew

on:
  schedule:
    # 表达式说明：分钟 小时 天 月 星期（均为 UTC）
    # 23 0 1 * * = 每月 1 日 UTC 00:23，即北京时间 08:23
    #
    # 为什么是 :23 而不是整点：
    # GitHub 官方文档说明 schedule 在高负载时会延迟甚至丢弃任务，而
    # 「每个整点开始」正是高负载时段，所以刻意错开到 :23。
    - cron: '45 0 1 * *'
  workflow_dispatch: # 保留手动触发按钮，方便测试

# 同一时间只跑一个，避免手动触发与定时任务撞车导致重复续期
concurrency:
  group: dnshe-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt
        - name: Check WeChat configuration
        env:
          WECHAT_API_URL: ${{ secrets.WECHAT_API_URL }}
          WECHAT_AUTH_TOKEN: ${{ secrets.WECHAT_AUTH_TOKEN }}
        run: |
          if [ -z "$WECHAT_API_URL" ]; then
            echo "::error::WECHAT_API_URL 为空，请检查 GitHub Actions Secrets"
          else
            echo "WECHAT_API_URL：已读取"
          fi

          if [ -z "$WECHAT_AUTH_TOKEN" ]; then
            echo "::error::WECHAT_AUTH_TOKEN 为空，请检查 GitHub Actions Secrets"
          else
            echo "WECHAT_AUTH_TOKEN：已读取"
          fi

      - name: Run renew script
        env:
          # DNSHE 多账号配置（必需）
          DNSHE_ACCOUNTS: ${{ secrets.DNSHE_ACCOUNTS }}

          # 自建微信/TG通知渠道
          WECHAT_API_URL: ${{ secrets.WECHAT_API_URL }}
          WECHAT_AUTH_TOKEN: ${{ secrets.WECHAT_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # 可选配置（如果这些也存在了 Secrets 里面，请把下面的 vars 也改成 secrets）
          DNSHE_RENEW_THRESHOLD_DAYS: ${{ secrets.DNSHE_RENEW_THRESHOLD_DAYS }}
          DNSHE_MIN_INTERVAL: ${{ secrets.DNSHE_MIN_INTERVAL }}
          DNSHE_TZ_OFFSET: ${{ secrets.DNSHE_TZ_OFFSET }}
          DNSHE_API_BASE_URL: ${{ secrets.DNSHE_API_BASE_URL }}

        run: python renew_domains.py
